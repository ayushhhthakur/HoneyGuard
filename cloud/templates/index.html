<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Token Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">AWS Token Logger</h1>

        <div class="bg-gray-50 p-6 rounded-lg shadow">
            <h5 class="text-lg font-semibold">Monitor Token Activity</h5>
            <form id="tokenForm" class="mt-3">
                <label for="token" class="block text-sm font-medium text-gray-700">Enter Token</label>
                <div class="flex mt-2 border rounded-lg overflow-hidden">
                    <span class="bg-gray-200 px-3 py-2 text-gray-600 text-sm">aws s3 ls --profile</span>
                    <input type="text" id="token" name="token" placeholder="stolen-key" 
                           class="flex-grow p-2 border-l outline-none">
                </div>
                <button type="submit" class="mt-4 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                    Run Command
                </button>
            </form>
            <div id="status" class="hidden mt-4 p-3 rounded-lg"></div>
        </div>
    </div>

    <script>
        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userInput = document.getElementById('token').value;
            const fullToken = "aws s3 ls --profile " + userInput;
            const statusDiv = document.getElementById('status');

            try {
                const response = await fetch('/monitor-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: fullToken })
                });

                const data = await response.json();

                statusDiv.classList.remove('hidden');
                if (data.success) {
                    statusDiv.className = 'mt-4 p-3 rounded-lg bg-green-100 text-green-700';
                    statusDiv.textContent = 'Token activity logged successfully';
                } else {
                    statusDiv.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-700';
                    statusDiv.textContent = data.error || 'Failed to log token activity';
                }
            } catch (error) {
                statusDiv.classList.remove('hidden');
                statusDiv.className = 'mt-4 p-3 rounded-lg bg-red-100 text-red-700';
                statusDiv.textContent = 'An error occurred while monitoring the token';
            }
        });
    </script>
</body>
</html>
