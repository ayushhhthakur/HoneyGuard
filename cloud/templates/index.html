<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyGuard Token Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-lg">
        <h1 class="text-2xl font-semibold mb-4 text-center">HoneyGuard Token Monitor</h1>
        
        <div class="mb-4">
            <h5 class="text-lg font-medium">Get Token Logs</h5>
            <form id="tokenForm" class="mt-3">
                <div class="mb-3">
                    <label for="token" class="block font-medium">Enter Token</label>
                    <div class="flex items-center border rounded p-2">
                        <span class="text-gray-500">aws s3 ls --profile</span>
                        <input type="text" id="token" name="token" class="flex-1 p-2 outline-none" placeholder="aws-key" required>
                    </div>
                </div>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded disabled:opacity-50" id="submitButton">Run Command</button>
            </form>
            <div id="status" class="mt-4 p-3 rounded hidden"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token').value;
            const statusDiv = document.getElementById('status');
            
            try {
                const response = await fetch('/monitor-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                
                const data = await response.json();
                statusDiv.classList.remove('hidden');
                statusDiv.className = data.success ? 'bg-red-500 text-white p-3 rounded mt-4' : 'bg-red-100 text-red-700 p-3 rounded mt-4';
                statusDiv.textContent = data.success ? 'Unable to fetch data' : data.error || 'Failed to log token activity';
            } catch (error) {
                statusDiv.classList.remove('hidden');
                statusDiv.className = 'bg-red-100 text-red-700 p-3 rounded mt-4';
                statusDiv.textContent = 'An error occurred while monitoring the token';
            }
        });
    </script>
</body>
</html>
